version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - ~/.kube:/root/.kube:ro

    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      KUBECONFIG_PATH: ${KUBECONFIG_PATH}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

    depends_on:
      - backend

    restart: always